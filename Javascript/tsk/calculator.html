<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 100px;
      }

      input,
      select,
      button {
        padding: 10px;
        margin: 5px;
      }

      button {
        background-color: green;
        border: none;
      }
      #result {
        color: blue;
      }
    </style>
  </head>

  <body>
    <h2>Calculator</h2>
    <input type="text" id="num1" placeholder="enter a number" />
    <input type="text" id="num2" placeholder="enter a number" />
    <select id="operator">
      <option value="+">Addition</option>
      <option value="-">Subtraction</option>
      <option value="*">Multiplication</option>
      <option value="/">Division</option>
    </select>
    <button onclick="calculator()">=</button>
    <p id="result"></p>
    <script>
      function add(a, b) {
        return a + b;
      }
      function Subtraction(a, b) {
        return a - b;
      }
      function Multiplication(a, b) {
        return a * b;
      }
      function Division(a, b) {
        return a / b;
      }
      function calculator() {
        let input1 = document.getElementById("num1").value;
        let input2 = document.getElementById("num2").value;
        let operator = document.getElementById("operator").value;
        let resultBox = document.getElementById("result");
        let a = Number(input1);
        let b = Number(input2);
        

        if (input1 === "" || input2 === "" || !Number.isFinite(a) || !Number.isFinite(b)) {
                resultBox.textContent = "Please enter a number.";
                return;
            }

        let result;
        if (operator == "+") result = add(a, b);
        else if (operator == "-") result = Subtraction(a, b);
        else if (operator == "*") result = Multiplication(a, b);
        else if (operator == "/"){
          if (b === 0) {
            resultBox.textContent = "Cannot divide by 0";
            return;
          }
        result = Division(a, b);
        }

        document.getElementById("result").textContent =
          "Answer : " + result.toFixed(2);
      }
    </script>
  </body>
</html>
