<!DOCTYPE html>
<html>
<head>
    <title>Lottery Draw</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container text-center mt-5">
+
    <h2>Lottery Draw</h2>

    <button class="btn btn-primary mt-3"
            onclick="selectWinner()">
        Select Winner
    </button>

    <h3 id="winner" class="mt-4"></h3>

</div>



<div class="modal fade" id="winnerModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">🎉 Lottery Winner 🎉</h5>

                <button type="button" class="close" data-dismiss="modal">
                    &times;
                </button>
            </div>

            <div class="modal-body text-center">
                <h2 id="modalWinner"></h2>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

    // Lottery ticket numbers
    let lotteryNumbers = [6238, 2222, 8907, 9999, 6666, 7777, 1230, 9981, 6677, 9966 ];


    function selectWinner() {

        
        let randomIndex = Math.floor(Math.random() * lotteryNumbers.length);
       
        let winner = lotteryNumbers[randomIndex];

        console.log("Lottery Winner:", winner);

        let winnerElement = document.getElementById("winner");

        winnerElement.innerHTML = "Winner: " + winner;
        winnerElement.style.color = "red";


        document.getElementById("modalWinner").innerHTML =
            "Winner: " + winner;

        $("#winnerModal").modal("show");
    }

</script>

</body>
</html>
