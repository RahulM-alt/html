   <script>
    const numbers = [3, 0, 7, , 0, 5];

const nonZero = numbers.filter(num => num !== 0);
const zeros = numbers.filter(num => num === 0);

const result = [...nonZero, ...zeros];

console.log(result); // [3, 7, 5, 0, 0]
   </script>
