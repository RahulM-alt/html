<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Tool</title>
</head>
<body>
    
<script>
const userProfile = {
    username: " Rahul123 ",
    bio: " I LOVE coding! JavaScript is Great!!! "
};

function cleanUserBio(profile) {

    let username = profile.username.trim().toLowerCase();

    let bio = profile.bio.trim().toLowerCase();

    bio = bio.replace(/javascript/g, "js");

    let bioLength = bio.length;

    return {
        username: username,
        bio: bio,
        bioLength: bioLength
    };
}

const result = cleanUserBio(userProfile);

console.log(result);
</script>
</body>
</html>
