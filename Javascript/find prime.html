    <title>prime</title>
</head>
<body>
    <script>
        for (let number = 10; number <= 50; number++) {
        let isPrime = true;

        for (let i = 2; i<number; i++){
           if (number % i ===0) {
            isPrime=false;
            break;
           }
        }
        if(isPrime){console.log(number)}
    }
        

    </script>
</body>
